# ==============================================================================
# Usage (run from monorepo root):
#   docker compose --env-file apps/api/.env up -d --build
# ==============================================================================
name: talkie

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

# Docker-internal connection strings, shared by api and worker.
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

# Shared definition for the backend image (api + worker).
x-app: &app-defaults
  <<: *service-defaults
  image: talkie-api:${GIT_COMMIT:-local-dev}
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: production
    args:
      GIT_COMMIT: ${GIT_COMMIT:-local-dev}
      NODE_ENV: ${NODE_ENV:-production}
  env_file:
    - ./apps/api/.env
  environment:
    <<: *app-env
  networks:
    - edge
    - data
    - monitoring
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
      - edge
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - data
      - edge
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    <<: *app-defaults
    # `environment` is replaced (not merged) when redefined, so re-merge the anchor.
    environment:
      <<: *app-env
      PORT: 3000
    command: ["node", "dist/main.js"]
    # greater than SHUTDOWN_TIMEOUT_MS + SHUTDOWN_DRAIN_MS
    stop_grace_period: 25s
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app-defaults
    command: ["node", "dist/worker.js"]
    # greater than WORKER_SHUTDOWN_TIMEOUT_MS
    stop_grace_period: 45s

  frontend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: production
      args:
        # Client-side bundle reaches api via host port
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        GIT_COMMIT: ${GIT_COMMIT:-local-dev}
        NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "127.0.0.1:3002:8080"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v3.5.0
    volumes:
      - ./apps/api/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9090/-/ready > /dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  loki:
    <<: *service-defaults
    image: grafana/loki:3.5.0
    volumes:
      - loki_data:/loki
    networks:
      - monitoring
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3100/ready > /dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  alloy:
    <<: *service-defaults
    image: grafana/alloy:v1.10.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./apps/api/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    networks:
      - monitoring
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    <<: *service-defaults
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
    volumes:
      - ./apps/api/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./apps/api/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
      - edge
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:
  loki_data:

networks:
  # Internal network for database & cache (no host gateway, no external routing)
  data:
    driver: bridge
    internal: true

  # External-facing network for host ports and ingress
  edge:
    driver: bridge
    internal: false

  # Internal network for metrics scraping and log ingestion
  monitoring:
    driver: bridge
    internal: true
