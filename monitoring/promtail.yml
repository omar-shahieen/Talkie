clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: nestjs
    static_configs:
      - targets: [localhost]
        labels:
          app: talkie-backend
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            correlationId: correlationId
            context: context
      - labels:
          level:
          correlationId:
          context:
