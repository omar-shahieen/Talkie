server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed static assets: cache permanently (1 year)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback for client-side routing: never cache index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
